<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>My First Azure Website</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>">
	<style>
		:root {
			--bg-start: #e8f1fb;
			--bg-end: #ffffff;
			--card-bg: #ffffff;
			--text-main: #333333;
			--accent: #0078D4;
			--accent-hover: #005a9e;
			--shadow: rgba(0, 120, 212, 0.15);
		}

		[data-theme="dark"] {
			--bg-start: #0d1b2a;
			--bg-end: #1b2a3d;
			--card-bg: #16263b;
			--text-main: #e8f1fb;
			--accent: #4cc2ff;
			--accent-hover: #74d0ff;
			--shadow: rgba(0, 0, 0, 0.4);
		}

		* {
			box-sizing: border-box;
		}

		body {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
			text-align: center;
			font-family: 'Segoe UI', sans-serif;
			background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
			transition: background 0.4s ease;
			position: relative;
			overflow: hidden;
		}

		.theme-toggle {
			position: absolute;
			top: 1.5rem;
			right: 1.5rem;
			background: var(--card-bg);
			border: none;
			border-radius: 50px;
			padding: 0.6rem 1.2rem;
			font-size: 1rem;
			cursor: pointer;
			box-shadow: 0 4px 15px var(--shadow);
			color: var(--text-main);
			transition: all 0.3s ease;
		}

		.theme-toggle:hover {
			transform: scale(1.05);
		}

		.card {
			background: var(--card-bg);
			padding: 3rem 4rem;
			border-radius: 16px;
			box-shadow: 0 8px 30px var(--shadow);
			transition: background 0.4s ease;
			z-index: 1;
		}

		h1 {
			font-size: 3.5rem;
			color: var(--accent);
			margin-bottom: 0.5rem;
			transition: color 0.4s ease;
		}

		.cloud {
			display: inline-block;
			animation: float 3s ease-in-out infinite;
		}

		@keyframes float {
			0%, 100% { transform: translateY(0); }
			50% { transform: translateY(-12px); }
		}

		p {
			font-size: 1.3rem;
			color: var(--text-main);
			margin-bottom: 2rem;
			transition: color 0.4s ease;
		}

		a.button {
			display: inline-block;
			background: var(--accent);
			color: white;
			text-decoration: none;
			padding: 0.8rem 2rem;
			border-radius: 8px;
			font-size: 1.1rem;
			transition: background 0.2s;
		}

		a.button:hover {
			background: var(--accent-hover);
		}
	</style>
</head>
<body>
	<button class="theme-toggle" onclick="toggleTheme()">🌙 Sötét mód</button>

	<div class="card">
		<h1>Hello, Azure! <span class="cloud">☁️</span></h1>
		<p>Ez az első weboldalam.</p>
		<p id="counter"></p>
		<a class="button" href="https://azure.microsoft.com" target="_blank">Tudj meg többet</a>
	</div>

	<script>
		function toggleTheme() {
			const html = document.documentElement;
			const btn = document.querySelector('.theme-toggle');
			const isDark = html.getAttribute('data-theme') === 'dark';

			if (isDark) {
				html.removeAttribute('data-theme');
				btn.textContent = '🌙 Sötét mód';
			} else {
				html.setAttribute('data-theme', 'dark');
				btn.textContent = '☀️ Világos mód';
			}
		}
	</script>
</body>
</html>
